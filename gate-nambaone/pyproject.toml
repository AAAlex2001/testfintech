[tool.poetry]
name = "gate-nambaone"
version = "0.1.0"
description = "Платёжный гейт Namba One"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115"
pydantic = "^2.11"
pydantic-settings = "^2.5"
httpx = "^0.28.1"
structlog = ">=24.4"
uvicorn = { extras = ["standard"], version = ">=0.32" }
elastic-apm = "^6.23"
sentry-sdk = "^2.19"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-httpx = ">=0.35"
pre-commit = "^4.0"

[build-system]
requires = ["poetry-core>=1.8.1"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["I", "E", "F"]

[tool.ruff.lint.isort]
force-single-line = true
